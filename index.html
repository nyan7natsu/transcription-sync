<!doctype html>
<html lang="ja-JP">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Transcription Sync</title>
</head>

<body>
  <div id="app">
    <div id="timer">
      <div id="timer-time">00:00.000</div>
      <div id="timer-button">
        <button id="timer-button-5sec">-5秒から開始</button>
        <button id="timer-button-3sec">-3秒から開始</button>
        <button id="timer-button-0sec">0秒から開始</button>
        <button id="timer-button-pause">一時停止</button>
        <button id="timer-button-resume" style="display: none;">再開</button>
      </div>
    </div>
    <div id="transcriptions">
      <div class="transcription">
        <progress class="transcription-progress" value="0" max="0"></progress>
        <div class="transcription-text"></div>
        <div class="transcription-time">00:00.000 - 00:10.000</div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
